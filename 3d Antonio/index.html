<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAAS · 360° render</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#e9ede9;color:#243b3e;overflow:hidden}button,a{font:inherit}button{cursor:pointer}header{position:fixed;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:26px 34px;pointer-events:none}.brand{font-size:29px;font-weight:800;letter-spacing:.12em}.caption{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:7px;opacity:.6}.tabs{pointer-events:auto;display:flex;gap:4px;padding:4px;border:1px solid #28424726;border-radius:100px;background:#eff2efda}.tabs button{border:0;border-radius:100px;background:transparent;color:inherit;padding:11px 18px}.tabs button.active{background:#294347;color:#fff}#stage{height:100dvh;width:100vw;background:#fff}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}#still{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}footer{position:fixed;z-index:3;bottom:25px;left:34px;right:34px;display:flex;justify-content:space-between;align-items:end;gap:20px}.finishes{display:flex;gap:8px}.finish,.control{border:1px solid #29434730;background:#f5f7f3dc;color:inherit;border-radius:100px;padding:12px 17px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}.finish.active{border-color:#294347;background:#294347;color:#fff}.chip{width:16px;height:16px;border-radius:50%;background:linear-gradient(125deg,#727e85,#eef1f4 40%,#7c898e)}.black{background:linear-gradient(125deg,#050609,#747979 40%,#101316)}.copper{background:linear-gradient(125deg,#945e3f,#f1bd90 40%,#a15e3e)}.hint{font-size:12px;opacity:.64;margin:12px 0 0 4px}.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:end}#loading{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-size:14px;letter-spacing:.1em}#message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);max-width:360px;text-align:center;display:none;background:#fff;padding:24px;border-radius:12px}
@media(max-width:600px){header{padding:22px}.brand{font-size:24px}.caption{font-size:10px}.tabs button{padding:10px 13px}footer{left:16px;right:16px;bottom:18px;display:block}.finishes{justify-content:center}.finish,.control{padding:11px 14px;font-size:13px}.tools{margin-top:14px;justify-content:center}.hint{text-align:center}#still{padding:70px 0 130px}}
</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><header><div><div class="brand">LAAS</div><div class="caption">Ring-Lock / Rhino model</div></div><div class="tabs"><button id="threeTab" class="active">360°</button><button id="stillTab">Rhino original</button></div></header>
<main id="stage"><img id="still" src="steel-rhino-original.png" alt="Studio rendering of the corrected steel LAAS Ring-Lock"></main><div id="loading">Loading the 3D model…</div><div id="message"></div>
<footer><div><div class="finishes"><button class="finish active" data-color="steel"><span class="chip"></span>Steel</button><button class="finish" data-color="black"><span class="chip black"></span>Black</button><button class="finish" data-color="copper"><span class="chip copper"></span>Copper</button></div><div class="hint" id="hint">Drag to rotate · Scroll to zoom</div></div><div class="tools"><button class="control" id="spin">Start rotation</button><button class="control" id="reset">Reset view</button><button class="control" id="save">Save 4K image ↗</button></div></footer>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';
const stage=document.querySelector('#stage'), loading=document.querySelector('#loading');
let renderer,scene,camera,group,meshes=[],manifest,auto=false,mode='3d',color='steel',yaw=.528,pitch=-.125,zoom=1,last=performance.now();
const baseY=-.0244;

function srgb(v){return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}
function setFinish(c){color=c;document.querySelectorAll('.finish').forEach(b=>b.classList.toggle('active',b.dataset.color===c));meshes.forEach(({mesh,index})=>{let p=manifest.materials[c][index];mesh.material.color.setRGB(...p.base.slice(0,3).map(srgb));mesh.material.metalness=Math.max(0,Math.min(1,p.metallic));mesh.material.roughness=Math.max(.08,Math.min(1,p.roughness));mesh.material.needsUpdate=true;});document.querySelector('#still').src=`${c}-rhino-original.png`;if(mode==='still')document.querySelector('#hint').textContent=`${c[0].toUpperCase()+c.slice(1)} · original Rhino render · 4500 × 4500`;}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);const span=2.10*zoom;const aspect=w/h;camera.left=-span/2*Math.max(1,aspect);camera.right=-camera.left;camera.top=span/2*Math.max(1,1/aspect);camera.bottom=-camera.top;camera.updateProjectionMatrix()}
function pose(){const dist=5;camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(0,baseY,0)}
function setMode(m){mode=m;document.querySelector('#still').style.display=m==='still'?'block':'none';renderer.domElement.style.visibility=m==='still'?'hidden':'visible';document.querySelector('#threeTab').classList.toggle('active',m==='3d');document.querySelector('#stillTab').classList.toggle('active',m==='still');document.querySelector('#hint').textContent=m==='still'?`${color[0].toUpperCase()+color.slice(1)} · original Rhino render · 4500 × 4500`:'Drag to rotate · Scroll to zoom';document.querySelector('#spin').disabled=m==='still';document.querySelector('#reset').disabled=m==='still';document.querySelector('#save').textContent=m==='still'?'Download render ↗':'Save 4K image ↗'}
try{
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;stage.prepend(renderer.domElement);
 scene=new THREE.Scene();const pmrem=new THREE.PMREMGenerator(renderer);const env=new RoomEnvironment();scene.environment=pmrem.fromScene(env,.04).texture;env.dispose();pmrem.dispose();
 camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,100);resize();
 group=new THREE.Group();scene.add(group);
 const responses=await Promise.all([fetch('lock.json'),fetch('lock.bin')]);manifest=await responses[0].json();const buffer=await responses[1].arrayBuffer();
 for(const o of manifest.objects){const geo=new THREE.BufferGeometry();const p=new Float32Array(buffer,o.v.offset,o.v.count).slice();const n=new Float32Array(buffer,o.n.offset,o.n.count).slice();for(let i=0;i<p.length;i+=3){const y=p[i+1];p[i+1]=p[i+2];p[i+2]=-y;const ny=n[i+1];n[i+1]=n[i+2];n[i+2]=-ny;}
 const uv=new Float32Array(p.length/3*2);for(let k=0;k<p.length;k+=3){const x=p[k]+.000105,y=p[k+1]+.0393875,z=p[k+2]+.049138;uv[k/3*2]=(Math.atan2(y,x)+Math.PI)/(2*Math.PI);uv[k/3*2+1]=(Math.atan2(z,Math.hypot(x,y)-.65)+Math.PI)/(2*Math.PI);}geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));geo.setAttribute('position',new THREE.BufferAttribute(p,3));geo.setAttribute('normal',new THREE.BufferAttribute(n,3));geo.setIndex(new THREE.BufferAttribute(new Uint32Array(buffer,o.f.offset,o.f.count),1));geo.computeBoundingSphere();const isMark=/Apple Find My|LAAS 2026 logo|Serial |CE end cap|WEEE end cap/.test(o.name);const mat=new THREE.MeshStandardMaterial({envMapIntensity:1,side:isMark?THREE.DoubleSide:THREE.FrontSide,polygonOffset:isMark,polygonOffsetFactor:isMark?-1:0,polygonOffsetUnits:isMark?-1:0});const mesh=new THREE.Mesh(geo,mat);mesh.name=o.name;group.add(mesh);meshes.push({mesh,index:o.material<0?0:o.material});}
 setFinish('steel');loading.style.display='none';window.renderReady=true;window.renderInfo={objects:meshes.length,vertices:manifest.objects.reduce((a,b)=>a+b.vertices,0),source:'corrected v8 Rhino geometry',appearance:'Realtime approximation; original Rhino render available in the adjacent tab'};
 let dragging=false,px=0,py=0;
 renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
 renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-px)*.008;pitch=Math.max(-.75,Math.min(.75,pitch+(e.clientY-py)*.005));px=e.clientX;py=e.clientY});
 renderer.domElement.addEventListener('pointerup',()=>{dragging=false});renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
 renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.72,Math.min(1.7,zoom+e.deltaY*.0006));resize()},{passive:false});
 function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if(auto&&!dragging&&mode==='3d')yaw+=dt*Math.PI/10;pose();renderer.render(scene,camera)}requestAnimationFrame(frame);
 document.querySelectorAll('.finish').forEach(b=>b.onclick=()=>setFinish(b.dataset.color));document.querySelector('#threeTab').onclick=()=>setMode('3d');document.querySelector('#stillTab').onclick=()=>setMode('still');
 document.querySelector('#spin').onclick=e=>{auto=!auto;e.target.textContent=auto?'Pause rotation':'Start rotation'};document.querySelector('#reset').onclick=()=>{yaw=.528;pitch=-.125;zoom=1;resize()};
 document.querySelector('#save').onclick=()=>{const a=document.createElement('a');if(mode==='still'){a.href=`${color}-rhino-original.png`;a.download=`LAAS-${color}-v8-original-4500.png`}else{const oldRatio=renderer.getPixelRatio();renderer.setPixelRatio(1);renderer.setSize(3840,2160,false);camera.left=-2.10*zoom/2*(3840/2160);camera.right=-camera.left;camera.top=2.10*zoom/2;camera.bottom=-camera.top;camera.updateProjectionMatrix();renderer.render(scene,camera);a.href=renderer.domElement.toDataURL('image/png');a.download=`LAAS-${color}-v8-4K.png`;renderer.setPixelRatio(oldRatio);resize()}a.click()};window.addEventListener('resize',resize);
}catch(error){loading.style.display='none';document.querySelector('#still').style.display='block';const msg=document.querySelector('#message');msg.textContent='The still render is ready. The interactive model could not load.';msg.style.display='block';console.error(error)}
</script></body></html>
